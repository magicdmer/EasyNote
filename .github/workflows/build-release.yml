name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install Qt5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
      - name: Build EasyNote
        run: |
          qmake EasyNote.pro -spec win32-msvc
          nmake release
      - name: Deploy dependencies
        run: |
          mkdir deploy\EasyNote
          copy release\EasyNote.exe deploy\EasyNote\
          windeployqt.exe --release deploy\EasyNote\EasyNote.exe
      - name: Package for Windows
        run: |
          cd deploy
          7z a -r ..\EasyNote-Windows-Qt5.zip EasyNote\
          cd ..
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyNote-Windows-Qt5
          path: EasyNote-Windows-Qt5.zip

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:10
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          printf 'deb http://archive.debian.org/debian buster main\n' > /etc/apt/sources.list
          printf 'deb http://archive.debian.org/debian-security buster/updates main\n' >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y qtbase5-dev libqt5x11extras5-dev build-essential libgl1-mesa-dev libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3 wget ca-certificates git dpkg dpkg-dev
      - name: Build EasyNote
        run: |
          export QT_SELECT=5
          qmake EasyNote.pro
          make -j$(nproc)
      - name: Extract version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Create DEB package structure
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Create directory structure
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/opt/EasyNote
          mkdir -p deb_root/usr/bin
          mkdir -p deb_root/usr/share/applications
          mkdir -p deb_root/usr/share/icons/hicolor/64x64/apps
          
          # Copy binary
          cp EasyNote deb_root/opt/EasyNote/
          chmod 755 deb_root/opt/EasyNote/EasyNote
          
          # Create symlink in /usr/bin
          ln -s /opt/EasyNote/EasyNote deb_root/usr/bin/EasyNote
          
          # Create .desktop file
          cat > deb_root/usr/share/applications/EasyNote.desktop << 'EOFILE'
          [Desktop Entry]
          Name=EasyNote
          Comment=A simple and useful note app
          Exec=/opt/EasyNote/EasyNote
          Icon=EasyNote
          Type=Application
          Categories=Office;Utility;
          Terminal=false
          EOFILE
          chmod 644 deb_root/usr/share/applications/EasyNote.desktop
          
          # Create control file
          cat > deb_root/DEBIAN/control << 'EOFILE'
          Package: easynote
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Homepage: https://github.com/magicdmer/EasyNote
          Depends: libc6 (>= 2.28), libgl1, libqt5core5a (>= 5.11.3), libqt5gui5 (>= 5.11.3), libqt5network5 (>= 5.11.3), libqt5widgets5 (>= 5.11.3), libstdc++6, libx11-6
          Maintainer: magicdmer <magicdmer@gmail.com>
          Installed-Size: 5120
          Description: A simple and useful note app
           EasyNote is a lightweight note-taking application based on Qt framework.
           Features include:
            - Simple and intuitive interface
            - Multiple note management
            - Rich text editing
            - Network support
          EOFILE
          chmod 644 deb_root/DEBIAN/control
      - name: Build DEB package
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          dpkg-deb --build deb_root EasyNote-${VERSION}-amd64.deb
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyNote-Linux-DEB
          path: EasyNote-*.deb

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            EasyNote-Windows-Qt5/EasyNote-Windows-Qt5.zip
            EasyNote-Linux-DEB/EasyNote-*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
